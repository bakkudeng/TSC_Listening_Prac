          {
            part: 5, type: "전자책 vs 종이책",
            chinese: "有人喜欢看电子书，有人喜欢看纸质书。你更倾向于哪一种？", pinyin: "Yǒu rén xǐhuan kàn diànzǐshū, yǒu rén xǐhuan kàn zhǐzhìshū. Nǐ gèng qīngxiàng yú nǎ yì zhǒng?",
            korean: "전자책과 종이책 중 어느 것을 더 선호하나요?", tip: "전자책(电子书)의 휴대성(方便携带)을 강조.",
            modelAnswer: "我更倾向于看电子书。首先，电子书非常轻便，走到哪里都可以用手机或平板看，节省了空间。其次，电子书的价格往往比纸质书便宜。因此，电子书更适合我。"
          },
          {
            part: 6, type: "휴가 요청",
            chinese: "你突然生病了，不能去公司上班。请给老板打电话请假。", pinyin: "Nǐ tūrán shēngbìng le, bùnéng qù gōngsī shàngbān. Qǐng gěi lǎobǎn dǎ diànhuà qǐngjià.",
            korean: "갑자기 병에 걸려 출근할 수 없습니다. 사장님께 전화하여 휴가를 요청하세요.", tip: "인사(老板好) + 증상(发烧/感冒) + 하루 휴가 요청(请一天的假).",
            modelAnswer: "老板，您好，真对不起，这么早打扰您。我今天早上突然发高烧，现在感觉非常不舒服，实在没法去公司上班了。我想向您请一天的病假，去医院看一看。工作的事情我已经交接给同事了，请您批准。"
          }
        ]
      }
    ];

    /* ==========================================
       APP STATE & LOGIC
       ========================================== */
    let currentDayIndex = 0;
    let completedDays = JSON.parse(localStorage.getItem('tsc_14day_allparts')) || [];
    let currentUtterance = null;
    
    // Web Speech API Initialization
    let zhVoice = null;
    function initSpeech() {
      if ('speechSynthesis' in window) {
        const loadVoices = () => {
          const voices = window.speechSynthesis.getVoices();
          zhVoice = voices.find(v => v.lang === 'zh-CN' || v.lang === 'zh_CN') ||
                    voices.find(v => v.lang.startsWith('zh')) || null;
        };
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
      }
    }

    // Bulletproof Text-to-Speech to prevent GC bugs on long sentences
    function speakText(text, rate = 1.0) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      setTimeout(() => {
        currentUtterance = new SpeechSynthesisUtterance(text);
        currentUtterance.lang = 'zh-CN';
        currentUtterance.rate = rate;
        if (zhVoice) currentUtterance.voice = zhVoice;
        
        currentUtterance.onend = () => { currentUtterance = null; };
        currentUtterance.onerror = () => { currentUtterance = null; };
        
        window.speechSynthesis.speak(currentUtterance);
      }, 30);
    }

    // UI Rendering
    function renderDaysGrid() {
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';
      
      CURRICULUM.forEach((dayData, index) => {
        const isCompleted = completedDays.includes(index);
        const isCurrent = index === currentDayIndex;
        
        const btn = document.createElement('button');
        btn.className = `p-2 rounded-xl text-xs font-bold transition-all border flex flex-col items-center justify-center gap-1 ${
          isCurrent ? 'bg-brand-600 border-brand-600 text-white shadow-md' :
          isCompleted ? 'bg-emerald-50 border-emerald-200 text-emerald-700 dark:bg-emerald-900/30 dark:border-emerald-800 dark:text-emerald-400' :
          'bg-white border-slate-200 text-slate-600 hover:border-brand-300 dark:bg-slate-700 dark:border-slate-600 dark:text-slate-300'
        }`;
        btn.onclick = () => loadDay(index);
        
        btn.innerHTML = `
          <span>D-${dayData.day}</span>
          ${isCompleted ? '<i class="ph-fill ph-check-circle text-base"></i>' : '<i class="ph-bold ph-lock-key-open text-base opacity-40"></i>'}
        `;
        grid.appendChild(btn);
      });

      // Update Overall Progress
      const pct = Math.round((completedDays.length / 14) * 100);
      document.getElementById('overallProgressText').textContent = `${pct}%`;
    }

    function loadDay(index) {
      currentDayIndex = index;
      const data = CURRICULUM[index];
      
      document.getElementById('currentDayBadge').textContent = `Day ${data.day}`;
      document.getElementById('currentDayTitle').textContent = data.title;
      
      const btn = document.getElementById('completeDayBtn');
      if (completedDays.includes(index)) {
        btn.className = 'px-4 py-2 rounded-xl bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300 text-sm font-bold flex items-center justify-center gap-2 cursor-default';
        btn.innerHTML = '<i class="ph-fill ph-check-circle"></i> <span>완료된 학습</span>';
        btn.disabled = true;
      } else {
        btn.className = 'px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-bold shadow-md transition-transform active:scale-95 flex items-center justify-center gap-2';
        btn.innerHTML = '<i class="ph-bold ph-check-circle"></i> <span>오늘 학습 완료</span>';
        btn.disabled = false;
      }

      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      data.questions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden shadow-sm';
        
        // Define color tag based on part
        const partColors = {
          2: 'bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-200',
          3: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900 dark:text-indigo-200',
          4: 'bg-violet-100 text-violet-700 dark:bg-violet-900 dark:text-violet-200',
          5: 'bg-fuchsia-100 text-fuchsia-700 dark:bg-fuchsia-900 dark:text-fuchsia-200',
          6: 'bg-rose-100 text-rose-700 dark:bg-rose-900 dark:text-rose-200'
        };
        const partTagColor = partColors[q.part] || 'bg-slate-100 text-slate-700';

        card.innerHTML = `
          <div class="p-4 sm:p-5 flex flex-col gap-4">
            <div class="flex justify-between items-start">
              <span class="text-xs font-bold ${partTagColor} px-2.5 py-1 rounded-md">Q${qIdx + 1} | Part ${q.part} (${q.type})</span>
              <button onclick="speakText('${q.chinese}')" class="w-10 h-10 rounded-full bg-brand-50 dark:bg-slate-700 text-brand-600 dark:text-brand-400 hover:bg-brand-100 flex items-center justify-center transition-colors" title="질문 듣기">
                <i class="ph-fill ph-speaker-high text-xl"></i>
              </button>
            </div>
            
            <div class="space-y-1">
              <p class="text-lg font-bold text-slate-900 dark:text-white tracking-wide leading-relaxed">${q.chinese}</p>
              <p class="text-sm font-mono text-slate-500 dark:text-slate-400">${q.pinyin}</p>
              <p class="text-sm text-slate-600 dark:text-slate-300 pt-1 border-t border-slate-100 dark:border-slate-700 mt-2">${q.korean}</p>
            </div>

            <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/50 rounded-xl p-3 text-xs text-amber-900 dark:text-amber-200 flex gap-2">
              <i class="ph-fill ph-lightbulb text-amber-500 text-sm shrink-0 mt-0.5"></i>
              <span>${q.tip}</span>
            </div>

            <div class="bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl p-4 mt-2">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-emerald-700 dark:text-emerald-400 flex items-center gap-1"><i class="ph-fill ph-check-circle"></i> 모범 답변 (섀도잉 추천)</span>
                <button onclick="speakText('${q.modelAnswer}', 0.95)" class="text-xs text-brand-600 hover:underline flex items-center gap-1 font-semibold"><i class="ph-bold ph-play"></i> 듣기</button>
              </div>
              <p class="text-sm font-medium text-slate-800 dark:text-slate-200 leading-relaxed">${q.modelAnswer}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      
      renderDaysGrid();
    }

    function markDayComplete() {
      if (!completedDays.includes(currentDayIndex)) {
        completedDays.push(currentDayIndex);
        localStorage.setItem('tsc_14day_allparts', JSON.stringify(completedDays));
        loadDay(currentDayIndex); // Refresh UI
      }
    }

    function resetProgress() {
      if (confirm("학습 진행도를 초기화하시겠습니까?")) {
        completedDays = [];
        localStorage.removeItem('tsc_14day_allparts');
        loadDay(0);
      }
    }

    // Theme Toggle Logic
    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // Init
    window.onload = () => {
      initSpeech();
      // Load last uncompleted day or Day 1
      let startDay = 0;
      for (let i = 0; i < CURRICULUM.length; i++) {
        if (!completedDays.includes(i)) {
          startDay = i;
          break;
        }
      }
      loadDay(startDay);
    };
  </script>
</body>
</html>
